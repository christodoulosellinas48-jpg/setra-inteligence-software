<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Setra — Intelligence Platform</title>
    <meta name="description" content="Setra is the financial intelligence platform built for independent restaurants, cafés, and bars. Track profitability, automate bookkeeping, manage VAT, and forecast cashflow — without a CFO." />
    <meta property="og:title" content="Setra — Financial Intelligence for Hospitality" />
    <meta property="og:description" content="The financial OS for independent restaurants. See your real profitability, fix what's bleeding, and grow with confidence." />
    <meta property="og:site_name" content="Setra Intelligence Platform" />
    <meta property="og:type" content="website" />
    <meta name="twitter:title" content="Setra — Financial Intelligence for Hospitality" />
    <meta name="twitter:description" content="The financial OS for independent restaurants. See your real profitability, fix what's bleeding, and grow with confidence." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Branded splash — renders before JS bundle loads -->
    <div id="setra-splash" style="position:fixed;inset:0;z-index:99999;background:#07070F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.2s ease;">
      <img src="https://media.base44.com/images/public/698f4ecdefcf4d820e54e33f/50df0face_EEEE413D-A65A-4B84-A6CE-9F681EADF652.png" alt="Setra" style="width:64px;height:64px;filter:drop-shadow(0 0 20px rgba(123,59,255,0.6));" />
      <div style="text-align:center;">
        <div style="color:#fff;font-size:20px;font-weight:700;letter-spacing:0.05em;font-family:system-ui,sans-serif;">SETRA</div>
        <div style="color:#6B7280;font-size:12px;letter-spacing:0.12em;font-family:system-ui,sans-serif;margin-top:4px;">INTELLIGENCE PLATFORM</div>
      </div>
      <div style="width:160px;height:3px;background:#1a1a30;border-radius:99px;overflow:hidden;">
        <div id="setra-splash-bar" style="height:100%;background:linear-gradient(90deg,#7B3BFF,#A855F7);border-radius:99px;animation:setra-pulse 1.2s ease-in-out infinite alternate;"></div>
      </div>
    </div>
    <style>
      @keyframes setra-pulse { from { width: 30%; opacity: 0.7; } to { width: 90%; opacity: 1; } }
    </style>
    <script>
      // Fade out splash once React mounts
      window.__hideSplash = function() {
        var s = document.getElementById('setra-splash');
        if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 220); }
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
